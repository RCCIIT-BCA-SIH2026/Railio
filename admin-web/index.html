<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Railio Controller — AI Railway Intelligence & Digital Twin</title>
    <meta name="description" content="AI-Powered Railway Digital Twin, Predictive Operations, Safety, Crowd Intelligence, and Incident Control Platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Russo+One&display=swap" rel="stylesheet">
    <style>
      /* Hide default Google Translate UI banners and tooltips */
      .goog-te-banner-frame {
        display: none !important;
      }
      body {
        top: 0px !important;
      }
      .goog-te-banner-frame.skiptranslate {
        display: none !important;
      }
      .goog-tooltip {
        display: none !important;
      }
      .goog-tooltip:hover {
        display: none !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
      #google_translate_element {
        display: none !important;
      }
      .skiptranslate iframe {
        display: none !important;
      }
      body > .skiptranslate {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased">
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,bn,ta,te,mr,gu,kn,ml,pa,or,ur',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
